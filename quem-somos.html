<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C&Q Finanças & Soluções | Quem somos?</title>
  <style>
    :root {
      --teal: #2ed7b4;
      --teal-dark: #009e81;
      --teal-light: #e9f9f6;
      --gray-light: #f5f7fa;
      --gray: #e0e4ea;
      --black: #222;
      --white: #fff;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--black);
      background: var(--gray-light);
    }

    header {
      background: var(--teal);
      color: var(--white);
      padding: 32px 0 24px;
      border-bottom: 4px solid var(--teal-dark);
    }

    .header-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .logo {
      height: 200px;
      width: auto;
      display: block;
      background: transparent;
      margin-bottom: 0;
      max-width: 100%;
    }

    nav {
      background: var(--white);
      box-shadow: 0 2px 8px rgba(46, 215, 180, 0.07);
      text-align: center;
      padding: 0;
    }

    nav a {
      color: var(--teal-dark);
      text-decoration: none;
      margin: 0 18px;
      font-weight: 600;
      padding: 16px 0;
      display: inline-block;
      transition: color 0.2s;
      letter-spacing: 0.5px;
    }

    nav a:hover {
      color: var(--black);
      border-bottom: 2px solid var(--teal-dark);
    }

    .container {
      max-width: 900px;
      margin: 36px auto;
      background: var(--white);
      padding: 36px 32px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(46, 215, 180, 0.04);
    }

    h2 {
      color: var(--teal-dark);
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 18px;
      margin-top: 0;
    }

    footer {
      background: var(--teal-dark);
      color: var(--white);
      text-align: center;
      padding: 30px 24px;
      margin-top: 40px;
      font-size: 1rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    nav.footer-nav {
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    nav.footer-nav a {
      color: #d4f1ec !important;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      margin: 6px 0;
      transition: text-decoration 0.2s;
    }

    nav.footer-nav a:hover {
      text-decoration: underline;
    }

    .footer-note {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #d4f1ec;
      max-width: 1100px;
      text-align: left;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .header-content { flex-direction: column; align-items: flex-start; }
