<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C&Q – Calculadoras Crédito</title>

  <!-- Ícone iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="Logo.png?v=2" />

  <style>
    :root {
      --cq-green: #10b981;
      --cq-green-dark: #0f766e;
      --cq-red: #ef4444;
      --cq-bg: #f5f5f5;
      --cq-card: #ffffff;
      --cq-text-main: #0f172a;
      --cq-text-muted: #6b7280;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--cq-bg);
      color: var(--cq-text-main);
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--cq-card);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(15,23,42,0.08);
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .logo img {
      max-width: 140px;
      height: auto;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      text-align: center;
    }
    h2 {
      font-size: 1rem;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #d4d4d8;
      box-sizing: border-box;
      margin-bottom: 10px;
      background: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--cq-green);
      box-shadow: 0 0 0 1px var(--cq-green);
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--cq-green), var(--cq-green-dark));
      color: #fff;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      background: #e5e7eb;
      padding: 4px;
      border-radius: 999px;
    }
    .tab {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 8px;
      font-size: 0.9rem;
      background: transparent;
      cursor: pointer;
      color: var(--cq-text-muted);
      font-weight: 500;
    }
    .tab.active {
      background: #ffffff;
      color: var(--cq-green-dark);
      box-shadow: 0 2px 6px rgba(15,23,42,0.12);
    }

    .calc-section {
      display: none;
    }
    .calc-section.active {
      display: block;
    }

    /* Card resultados transferência */
    .results {
      margin-top: 16px;
      border-radius: 14px;
      overflow: hidden;
      display: none;
    }
    .results-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .results-header-amount {
      font-size: 1.1rem;
    }
    .results-body {
      background: #f9fafb;
      padding: 12px 14px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }
    .results-column {
      flex: 1 1 150px;
    }
    .results-label {
      color: var(--cq-text-muted);
      margin-bottom: 4px;
    }
    .results-value-main {
      font-weight: 700;
      font-size: 1rem;
    }
    .results-value-muted {
      text-decoration: line-through;
      color: #9ca3af;
      margin-left: 4px;
      font-size: 0.85rem;
    }
    .results-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      margin-top: 6px;
    }
    .results-tag-icon {
      font-size: 1.1rem;
    }
    .results.savings .results-header {
      background: var(--cq-green);
    }
    .results.increase .results-header {
      background: var(--cq-red);
    }
    .juros-block.juros-saving .results-value-main,
    .juros-block.juros-saving .results-tag {
      color: var(--cq-green-dark);
    }
    .juros-block.juros-increase .results-value-main,
    .juros-block.juros-increase .results-tag {
      color: var(--cq-red);
    }

    /* Card resultados compra casa */
    .results-buy {
      margin-top: 16px;
      border-radius: 14px;
      overflow: hidden;
      display: none;
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
    }
    .results-buy-header {
      padding: 10px 14px;
      background: var(--cq-green);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .results-buy-body {
      padding: 12px 14px;
      background: #f9fafb;
      font-size: 0.9rem;
    }
    .results-buy-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .results-buy-label {
      color: var(--cq-text-muted);
    }
    .results-buy-value {
      font-weight: 700;
    }
    .results-buy-tag {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--cq-text-muted);
    }

    .disclaimer {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- LOGO C&Q -->
    <div class="logo">
      <img src="Logo.png?v=2" alt="C&Q Finanças & Soluções" />
    </div>

    <h1>C&Q – Calculadoras de Crédito</h1>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" data-target="transfer">Transferência de crédito</button>
      <button class="tab" data-target="compra">Compra de casa</button>
    </div>

    <!-- CALCULADORA TRANSFERÊNCIA -->
    <div id="calc-transfer" class="calc-section active">
      <h2>Situação atual</h2>
      <label>Montante em dívida (€)</label>
      <input id="currentPrincipal" type="number" step="0.01" placeholder="Ex.: 330000" />

      <label>TAN anual atual (%)</label>
      <input id="currentRate" type="number" step="0.01" placeholder="Ex.: 2.855" />

      <label>Prazo remanescente (meses)</label>
      <input id="currentMonths" type="number" step="1" placeholder="Ex.: 387" />

      <h2>Nova situação</h2>
      <label>Novo montante em dívida (€)</label>
      <input id="newPrincipal" type="number" step="0.01" placeholder="Ex.: 330000 ou 350000 se pedir mais" />

      <label>Nova TAN anual (%)</label>
      <input id="newRate" type="number" step="0.01" placeholder="Ex.: 2" />

      <label>Novo prazo (meses)</label>
      <input id="newMonths" type="number" step="1" placeholder="Ex.: 384" />

      <button onclick="calcularTransfer()">Calcular poupança</button>

      <div id="results" class="results"></div>
    </div>

    <!-- CALCULADORA COMPRA CASA -->
    <div id="calc-compra" class="calc-section">
      <h2>Dados do agregado</h2>

      <label>Rendimento líquido mensal do agregado (€)</label>
      <input id="buyNetIncome" type="number" step="1" placeholder="Ex.: 1 200" />

      <label>Prestação mensal de outros créditos (€)</label>
      <input id="buyOtherLoans" type="number" step="1" placeholder="Ex.: 0" />

      <label>Número de titulares</label>
      <select id="buyNumBorrowers">
        <option value="1">1 titular</option>
        <option value="2">2 titulares</option>
        <option value="3">3 ou mais titulares</option>
      </select>

      <label>Idade do titular mais velho (anos)</label>
      <input id="buyAge" type="number" step="1" placeholder="Ex.: 26" />

      <label>Entrada / capitais próprios (€)</label>
      <input id="buyDownPayment" type="number" step="1" placeholder="Ex.: 20 000" />

      <h2>Parâmetros do crédito</h2>

      <label>Taxa de esforço máxima considerada (%)</label>
      <select id="buyMaxEffort">
        <option value="35">35% (mais conservador)</option>
        <option value="40">40% (mais agressivo)</option>
      </select>

      <label>TAN anual estimada (%)</label>
      <input id="buyRate" type="number" step="0.01" placeholder="Ex.: 3" />

      <button onclick="calcularCompra()">Calcular capacidade de compra</button>

      <div id="results-buy" class="results-buy"></div>
    </div>

    <div class="disclaimer">
      ⚠️ Os valores apresentados são estimativas simplificadas e não substituem a análise detalhada das condições de crédito pelas instituições financeiras nem constituem proposta contratual.
    </div>
  </div>

  <script>
    // ---- Funções comuns ----
    function formatCurrency(value) {
      return value.toLocaleString("pt-PT", {
        style: "currency",
        currency: "EUR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function calcularPrestacaoEJuros(principal, annualRatePercent, months) {
      const monthlyRate = (annualRatePercent / 100) / 12;
      let payment;

      if (monthlyRate === 0) {
        payment = principal / months;
      } else {
        const factor = Math.pow(1 + monthlyRate, months);
        payment = principal * monthlyRate * factor / (factor - 1);
      }

      const totalPaid = payment * months;
      const totalInterest = totalPaid - principal;

      return { payment, totalInterest };
    }

    // ---- Tabs ----
    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        btn.classList.add("active");

        const target = btn.getAttribute("data-target");
        document.querySelectorAll(".calc-section").forEach((sec) => {
          sec.classList.remove("active");
        });
        document.getElementById(target === "transfer" ? "calc-transfer" : "calc-compra")
          .classList.add("active");
      });
    });

    // ---- CALCULADORA TRANSFERÊNCIA ----
    function calcularTransfer() {
      const principal = parseFloat(
        document.getElementById("currentPrincipal").value.replace(",", ".")
      );
      const currentRate = parseFloat(
        document.getElementById("currentRate").value.replace(",", ".")
      );
      const currentMonths = parseInt(
        document.getElementById("currentMonths").value, 10
      );

      const newPrincipalRaw = document.getElementById("newPrincipal").value;
      const newRate = parseFloat(
        document.getElementById("newRate").value.replace(",", ".")
      );
      const newMonths = parseInt(
        document.getElementById("newMonths").value, 10
      );

      const resultsDiv = document.getElementById("results");

      if (
        isNaN(principal) ||
        isNaN(currentRate) ||
        isNaN(currentMonths) ||
        isNaN(newRate) ||
        isNaN(newMonths)
      ) {
        resultsDiv.style.display = "block";
        resultsDiv.className = "results increase";
        resultsDiv.innerHTML =
          "<div class='results-header'><span>Dados em falta</span><span class='results-header-amount'>–</span></div>" +
          "<div class='results-body'><div class='results-column'>Por favor preencha todos os campos com valores válidos (exceto o novo montante, que é opcional).</div></div>";
        return;
      }

      let newPrincipal = parseFloat(newPrincipalRaw.replace(",", "."));
      if (isNaN(newPrincipal)) {
        newPrincipal = principal;
      }

      const atual = calcularPrestacaoEJuros(principal, currentRate, currentMonths);
      const novo = calcularPrestacaoEJuros(newPrincipal, newRate, newMonths);

      const diffMensal = novo.payment - atual.payment;
      const diffTotal = novo.totalInterest - atual.totalInterest;

      const isSavingPrest = diffMensal < 0;
      const headerTitle = isSavingPrest
        ? "Poupança mensal estimada:"
        : "Prestação mensal aumenta em:";
      const headerAmount = formatCurrency(Math.abs(diffMensal));

      const isJurosSaving = diffTotal < 0;
      const jurosLabel = isJurosSaving
        ? "Valor dos juros totais diminui em:"
        : "Valor dos juros totais aumenta em:";
      const jurosAmount = formatCurrency(Math.abs(diffTotal));
      const jurosTrendClass = isJurosSaving ? "juros-saving" : "juros-increase";
      const jurosIcon = isJurosSaving ? "⬇️" : "⬆️";

      resultsDiv.className = "results " + (isSavingPrest ? "savings" : "increase");
      resultsDiv.style.display = "block";

      resultsDiv.innerHTML = `
        <div class="results-header">
          <span>${headerTitle}</span>
          <span class="results-header-amount">${headerAmount}</span>
        </div>
        <div class="results-body">
          <div class="results-column">
            <div class="results-label">Prestação mensal</div>
            <div class="results-value-main">
              ${formatCurrency(novo.payment)}
              <span class="results-value-muted">${formatCurrency(atual.payment)}</span>
            </div>
            <div class="results-tag">
              <span class="results-tag-icon">${isSavingPrest ? "✅" : "⚠️"}</span>
              <span>${isSavingPrest ? "Prestação mais baixa" : "Prestação mais elevada"}</span>
            </div>
          </div>
          <div class="results-column juros-block ${jurosTrendClass}">
            <div class="results-label">Juros totais do contrato</div>
            <div class="results-value-main">${jurosAmount}</div>
            <div class="results-tag">
              <span class="results-tag-icon">${jurosIcon}</span>
              <span>${jurosLabel}</span>
            </div>
          </div>
        </div>
      `;
    }

    // ---- CALCULADORA COMPRA CASA ----
    function calcularCompra() {
      const netIncome = parseFloat(
        document.getElementById("buyNetIncome").value.replace(",", ".")
      );
      const otherLoans = parseFloat(
        document.getElementById("buyOtherLoans").value.replace(",", ".")
      ) || 0;
      const numBorrowers = parseInt(
        document.getElementById("buyNumBorrowers").value, 10
      );
      const age = parseInt(
        document.getElementById("buyAge").value, 10
      );
      const downPayment = parseFloat(
        document.getElementById("buyDownPayment").value.replace(",", ".")
      ) || 0;
      const maxEffort = parseFloat(
        document.getElementById("buyMaxEffort").value.replace(",", ".")
      );
      const rate = parseFloat(
        document.getElementById("buyRate").value.replace(",", ".")
      );

      const resultsDiv = document.getElementById("results-buy");

      if (
        isNaN(netIncome) ||
        isNaN(age) ||
        isNaN(maxEffort) ||
        isNaN(rate)
      ) {
        resultsDiv.style.display = "block";
        resultsDiv.innerHTML =
          "<div class='results-buy-header'><span>Dados em falta</span><span>–</span></div>" +
          "<div class='results-buy-body'>Por favor preencha pelo menos: rendimento, idade, taxa de esforço e TAN estimada.</div>";
        return;
      }

      // Prestação máxima para crédito habitação
      const maxHousingEffort = netIncome * (maxEffort / 100) - otherLoans;

      if (maxHousingEffort <= 0) {
        resultsDiv.style.display = "block";
        resultsDiv.innerHTML =
          "<div class='results-buy-header'><span>Sem margem para nova prestação</span><span>⚠️</span></div>" +
          "<div class='results-buy-body'>Com os dados inseridos, a prestação máxima disponível para crédito habitação é nula ou negativa. Será necessário rever rendimentos/despesas.</div>";
        return;
      }

      // Prazo máximo: até 75 anos, máximo 40 anos
      let maxYears = 75 - age;
      if (maxYears > 40) maxYears = 40;
      if (maxYears < 5) maxYears = 5;
      const months = maxYears * 12;

      // Montante máximo financiado (resolvendo pelo capital)
      const monthlyRate = (rate / 100) / 12;
      let maxLoan = 0;
      if (monthlyRate === 0) {
        maxLoan = maxHousingEffort * months;
      } else {
        const factor = Math.pow(1 + monthlyRate, months);
        maxLoan = maxHousingEffort * (factor - 1) / (monthlyRate * factor);
      }

      if (maxLoan < 0) maxLoan = 0;

      const housePrice = maxLoan + downPayment;

      resultsDiv.style.display = "block";
      resultsDiv.innerHTML = `
        <div class="results-buy-header">
          <span>Estimativa de capacidade de compra</span>
          <span>${formatCurrency(housePrice)}</span>
        </div>
        <div class="results-buy-body">
          <div class="results-buy-row">
            <span class="results-buy-label">Prestação máxima de crédito:</span>
            <span class="results-buy-value">${formatCurrency(maxHousingEffort)}</span>
          </div>
          <div class="results-buy-row">
            <span class="results-buy-label">Montante máximo de financiamento:</span>
            <span class="results-buy-value">${formatCurrency(maxLoan)}</span>
          </div>
          <div class="results-buy-row">
            <span class="results-buy-label">Valor indicativo máximo de compra:</span>
            <span class="results-buy-value">${formatCurrency(housePrice)}</span>
          </div>
          <div class="results-buy-row">
            <span class="results-buy-label">Prazo considerado:</span>
            <span class="results-buy-value">${maxYears} anos</span>
          </div>
          <div class="results-buy-tag">
            Cálculo efetuado com taxa de esforço de ${maxEffort}% e TAN estimada de ${rate}%,
            assumindo um prazo até aos ${75} anos de idade do titular mais velho (máx. 40 anos).
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
