<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C&Q – Calculadora Crédito</title>

  <!-- Ícone iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="Logo.png?v=2" />

  <style>
    :root {
      /* Cores estilo C&Q */
      --cq-green: #10b981;
      --cq-green-dark: #0f766e;
      --cq-red: #ef4444;
      --cq-bg: #f5f5f5;
      --cq-card: #ffffff;
      --cq-text-main: #0f172a;
      --cq-text-muted: #6b7280;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--cq-bg);
      color: var(--cq-text-main);
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--cq-card);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(15,23,42,0.08);
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .logo img {
      max-width: 140px;
      height: auto;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      text-align: center;
    }
    h2 {
      font-size: 1rem;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #d4d4d8;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    input:focus {
      outline: none;
      border-color: var(--cq-green);
      box-shadow: 0 0 0 1px var(--cq-green);
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--cq-green), var(--cq-green-dark));
      color: #fff;
      font-weight: 600;
      margin-top: 4px;
    }

    .results {
      margin-top: 16px;
      border-radius: 14px;
      overflow: hidden;
      display: none;
    }

    .results-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .results-header-amount {
      font-size: 1.1rem;
    }

    .results-body {
      background: #f9fafb;
      padding: 12px 14px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .results-column {
      flex: 1 1 150px;
    }

    .results-label {
      color: var(--cq-text-muted);
      margin-bottom: 4px;
    }

    .results-value-main {
      font-weight: 700;
      font-size: 1rem;
    }

    .results-value-muted {
      text-decoration: line-through;
      color: #9ca3af;
      margin-left: 4px;
      font-size: 0.85rem;
    }

    .results-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .results-tag-icon {
      font-size: 1.1rem;
    }

    /* cores dinâmicas */
    .results.savings .results-header {
      background: var(--cq-green);
    }
    .results.increase .results-header {
      background: var(--cq-red);
    }

    .disclaimer {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- LOGO C&Q -->
    <div class="logo">
      <img src="Logo.png?v=2" alt="C&Q Finanças & Soluções" />
    </div>

    <h1>C&Q – Calculadora de Transferência</h1>

    <h2>Situação atual</h2>
    <label>Montante em dívida (€)</label>
    <input id="currentPrincipal" type="number" step="0.01" placeholder="Ex.: 330000" />

    <label>TAN anual atual (%)</label>
    <input id="currentRate" type="number" step="0.01" placeholder="Ex.: 2.855" />

    <label>Prazo remanescente (meses)</label>
    <input id="currentMonths" type="number" step="1" placeholder="Ex.: 387" />

    <h2>Nova situação</h2>
    <label>Novo montante em dívida (€)</label>
    <input id="newPrincipal" type="number" step="0.01" placeholder="Ex.: 330000 ou 350000 se pedir mais" />

    <label>Nova TAN anual (%)</label>
    <input id="newRate" type="number" step="0.01" placeholder="Ex.: 2" />

    <label>Novo prazo (meses)</label>
    <input id="newMonths" type="number" step="1" placeholder="Ex.: 384" />

    <button onclick="calcular()">Calcular poupança</button>

    <div id="results" class="results"></div>

    <div class="disclaimer">
      ⚠️ Os valores apresentados são estimativas simplificadas e não substituem a análise detalhada das condições de crédito pelas instituições financeiras nem constituem proposta contratual.
    </div>
  </div>

  <script>
    function formatCurrency(value) {
      return value.toLocaleString("pt-PT", {
        style: "currency",
        currency: "EUR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function calcularPrestacaoEJuros(principal, annualRatePercent, months) {
      const monthlyRate = (annualRatePercent / 100) / 12;
      let payment;

      if (monthlyRate === 0) {
        payment = principal / months;
      } else {
        const factor = Math.pow(1 + monthlyRate, months);
        payment = principal * monthlyRate * factor / (factor - 1);
      }

      const totalPaid = payment * months;
      const totalInterest = totalPaid - principal;

      return { payment, totalInterest };
    }

    function calcular() {
      const principal = parseFloat(
        document.getElementById("currentPrincipal").value.replace(",", ".")
      );
      const currentRate = parseFloat(
        document.getElementById("currentRate").value.replace(",", ".")
      );
      const currentMonths = parseInt(
        document.getElementById("currentMonths").value, 10
      );

      const newPrincipalRaw = document.getElementById("newPrincipal").value;
      const newRate = parseFloat(
        document.getElementById("newRate").value.replace(",", ".")
      );
      const newMonths = parseInt(
        document.getElementById("newMonths").value, 10
      );

      const resultsDiv = document.getElementById("results");

      if (
        isNaN(principal) ||
        isNaN(currentRate) ||
        isNaN(currentMonths) ||
        isNaN(newRate) ||
        isNaN(newMonths)
      ) {
        resultsDiv.style.display = "block";
        resultsDiv.className = "results increase"; // só para ter estilo
        resultsDiv.innerHTML =
          "<div class='results-header'><span>Dados em falta</span><span class='results-header-amount'>–</span></div>" +
          "<div class='results-body'><div class='results-column'>Por favor preencha todos os campos com valores válidos (exceto o novo montante, que é opcional).</div></div>";
        return;
      }

      // Se não preencher novo montante, assume o montante atual
      let newPrincipal = parseFloat(newPrincipalRaw.replace(",", "."));
      if (isNaN(newPrincipal)) {
        newPrincipal = principal;
      }

      const atual = calcularPrestacaoEJuros(principal, currentRate, currentMonths);
      const novo = calcularPrestacaoEJuros(newPrincipal, newRate, newMonths);

      const diffMensal = novo.payment - atual.payment;
      const diffTotal = novo.totalInterest - atual.totalInterest;

      const isSaving = diffMensal < 0;
      const headerTitle = isSaving
        ? "Poupança mensal estimada:"
        : "Prestação mensal aumenta em:";
      const headerAmount = formatCurrency(Math.abs(diffMensal));

      const jurosLabel = diffTotal < 0
        ? "Valor dos juros totais diminui em:"
        : "Valor dos juros totais aumenta em:";
      const jurosAmount = formatCurrency(Math.abs(diffTotal));

      // definir classes para cores
      resultsDiv.className = "results " + (isSaving ? "savings" : "increase");
      resultsDiv.style.display = "block";

      resultsDiv.innerHTML = `
        <div class="results-header">
          <span>${headerTitle}</span>
          <span class="results-header-amount">${headerAmount}</span>
        </div>
        <div class="results-body">
          <div class="results-column">
            <div class="results-label">Prestação mensal</div>
            <div class="results-value-main">
              ${formatCurrency(novo.payment)}
              <span class="results-value-muted">${formatCurrency(atual.payment)}</span>
            </div>
            <div class="results-tag">
              <span class="results-tag-icon">${isSaving ? "✅" : "⚠️"}</span>
              <span>${isSaving ? "Prestação mais baixa" : "Prestação mais elevada"}</span>
            </div>
          </div>
          <div class="results-column">
            <div class="results-label">Juros totais do contrato</div>
            <div class="results-value-main">${jurosAmount}</div>
            <div class="results-tag">
              <span class="results-tag-icon">📉</span>
              <span>${jurosLabel}</span>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
